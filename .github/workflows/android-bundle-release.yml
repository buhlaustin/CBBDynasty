name: Android release bundle (AAB)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: android-bundle-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  bundle-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        working-directory: ${{ github.workspace }}
        run: bash scripts/install_android_sdk.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode upload keystore
        id: upload_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "play_signing=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing upload-keystore secrets — building with debug signing (not for Play production). See docs/ANDROID_RELEASE_CI.md"
            exit 0
          fi
          cleaned=$(printf '%s' "$KEYSTORE_BASE64" | tr -d ' \n\r\t')
          if ! printf '%s' "$cleaned" | base64 --decode > app/upload.keystore; then
            echo "play_signing=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not valid base64 — building with debug signing. Re-paste the one-line value from docs/ANDROID_RELEASE_CI.md"
            rm -f app/upload.keystore
            exit 0
          fi
          chmod 600 app/upload.keystore
          echo "play_signing=true" >> "$GITHUB_OUTPUT"

      - name: Bundle release AAB
        env:
          PLAY_SIGNING: ${{ steps.upload_keystore.outputs.play_signing }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$PLAY_SIGNING" = "true" ]; then
            export ANDROID_KEYSTORE_PATH="${GITHUB_WORKSPACE}/android/app/upload.keystore"
            export ANDROID_KEYSTORE_PASSWORD
            export ANDROID_KEY_ALIAS
            export ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          fi
          ./gradlew :app:bundleRelease :app:extractReleaseNativeDebugMetadata --no-daemon

      - name: Verify AAB signing (MEGA-QA-137)
        working-directory: ${{ github.workspace }}
        run: bash scripts/verify_play_aab_signing.sh

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload Play deobfuscation (R8 mapping)
        uses: actions/upload-artifact@v4
        with:
          name: play-mapping-txt
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Upload Play native debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: play-native-debug-symbols
          path: android/app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
          if-no-files-found: warn
