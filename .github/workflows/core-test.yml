name: Core tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: core-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  core-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint player-facing strings
        working-directory: ${{ github.workspace }}
        run: python3 scripts/lint_player_strings.py

      - name: Check adaptive launcher icon sync
        working-directory: ${{ github.workspace }}
        run: |
          pip install -q cairosvg pillow
          python3 planning/tools/generate_adaptive_icon.py --check

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run :core:test and :database:test
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew :core:test :database:test --no-daemon && exit 0
            echo "Gradle attempt $attempt failed; retrying in 25s..."
            sleep 25
          done
          exit 1
