name: Android emulator API 34 smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-emulator-api34-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api34-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        working-directory: ${{ github.workspace }}
        run: bash scripts/install_android_sdk.sh

      - name: Install API 34 emulator image
        working-directory: ${{ github.workspace }}
        run: bash scripts/install_android_emulator_api34.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run connected tests on API 34 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            cd android
            ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:connectedDebugAndroidTest --no-daemon
